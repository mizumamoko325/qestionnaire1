<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于「为村庄修志」的十六个问题</title>
  <style>
    :root {
      --paper: #F2EDE2;
      --paper-light: #F8F4EA;
      --ink: #1F1A14;
      --ink-soft: #4A4138;
      --ink-faint: #8C8275;
      --seal: #8E2C26;
      --seal-soft: #B07A4A;
      --line: #D4C9B0;
      --line-faint: #E5DDC9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 模拟宣纸质感的底纹 */
    .paper-bg {
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at top left, rgba(176, 122, 74, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(142, 44, 38, 0.03) 0%, transparent 50%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .container { padding: 5rem 2rem; }
    }

    /* 字体排版 */
    .serif-title {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      font-weight: 900;
      letter-spacing: 0.02em;
    }
    .serif-body {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .serif-italic {
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      font-style: italic;
      font-weight: 400;
    }
    .sans-small {
      font-family: sans-serif;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--ink-faint);
    }

    .seal-color { color: var(--seal); }
    .ink-soft { color: var(--ink-soft); }
    .ink-faint { color: var(--ink-faint); }

    .line-divider {
      background-color: var(--line);
      height: 1px;
      width: 5rem;
      margin: 2rem 0;
    }

    .line-divider-faint {
      background-color: var(--line-faint);
      height: 1px;
      width: 100%;
    }

    /* 封面与结语按钮 */
    .start-button {
      font-family: "Noto Serif SC", serif;
      letter-spacing: 0.4em;
      padding: 14px 48px;
      border: 1px solid var(--ink);
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: all 300ms;
      font-size: 15px;
    }
    .start-button:hover {
      background: var(--ink);
      color: var(--paper);
    }

    /* 选项卡片 */
    .option-card {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1.25rem;
      margin-bottom: 0.85rem;
      cursor: pointer;
      transition: background-color 200ms, border-color 200ms;
      background-color: transparent;
    }
    .option-card:hover {
      background-color: var(--paper-light);
      border-color: var(--ink-faint);
    }
    .option-card.expanded {
      background-color: var(--paper-light);
      border-color: var(--ink-soft);
    }

    .option-letter {
      font-family: serif;
      font-style: italic;
      font-weight: 500;
      font-size: 1.25rem;
      margin-right: 1rem;
      min-width: 1.5rem;
      display: inline-block;
    }
    .option-letter.expanded { color: var(--seal); }
    .option-letter.collapsed { color: var(--ink-faint); }

    /* 展开的诊断说明 */
    .option-diag {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line-faint);
      display: flex;
      gap: 1rem;
    }
    .vertical-line {
      width: 2px;
      background: var(--seal);
      opacity: 0.4;
      flex-shrink: 0;
    }

    /* 底部导航栏 */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line-faint);
    }
    .nav-btn {
      background: none;
      border: none;
      font-family: "Noto Serif SC", serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      color: var(--ink);
      padding: 0.5rem 0;
      transition: color 200ms;
    }
    .nav-btn:hover { color: var(--seal); }
    .nav-btn:disabled { color: var(--ink-faint); cursor: not-allowed; }

    /* 印章 */
    .seal-stamp {
      display: inline-block;
      border: 1.5px solid var(--seal);
      color: var(--seal);
      padding: 6px 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.15em;
      transform: rotate(-2deg);
      font-family: "Noto Serif SC", serif;
    }

    /* 进度条 */
    .progress-track { height: 1px; background: var(--line-faint); width: 100%; margin-bottom: 2.5rem; }
    .progress-fill { height: 1px; background: var(--seal); transition: width 500ms ease-out; }

    /* 页面淡入动画 */
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-in { animation: pageIn 500ms ease-out both; }
  </style>
</head>
<body>
  <div class="paper-bg" id="app">
    <!-- 动态渲染区域 -->
  </div>

  <script>
    // 问卷完整核心数据
    const COVER = {
      title: "关于「为村庄修志」的十六个问题",
      intro: [
        "这不是一份测试。它没有标准答案，也不是要驳倒任何想为家乡留下文字的人。",
        "它是十六组提问，帮你看清自己关于「修志」「研究」「消亡」「家乡」这些事的预设、立场和可能的盲点。",
        "每道题选完一个选项后，会在下方展开一段诊断说明。你可以点开所有选项的诊断，对照阅读，再自行决定是否进入下一题。",
        "最有意思的发现，往往不是某一题的答案，而是不同题目之间立场的不一致——那些不一致的地方，正是值得自己追问的位置。",
      ],
      start: "开始",
    };

    const CLOSING = {
      restart: "重新开始",
    };

    const Q = [
      {
        num: "一",
        title: "你认为为什么需要为当代村庄编修村志？",
        options: [
          { key: "A", text: "抢救即将消失的村庄文化记忆，给后人留下念想", diag: "这是最普遍也最值得反思的选项。法国历史学家 Pierre Nora 提出过一个判断：一个社会真正「活着」的传统是不需要被「抢救」的，它在日常生活中自然延续。一旦人们开始用「抢救」「留住」「趁还来得及」这种语言谈论某种文化，就说明那种文化的生活基础已经断裂——剩下的不是传统本身，而是关于传统的纪念物（他称之为「记忆之场」）。所以「抢救式修志」不是在延续村庄的生命，而是在制造一个关于「曾经存在过一个村庄」的纪念碑。" },
          { key: "B", text: "延续中华方志传统，传承数千年的修志文脉", diag: "「延续传统」听起来天经地义，但这里有一个事实问题：古代根本没有稳固的「村志」传统。当代「村村修志」是 1980 年代后才大规模出现的现象，2015 年才被正式纳入国家规划。也就是说，「村志传统」很大程度上是被追溯性建构出来的。" },
          { key: "C", text: "全面记录村庄的自然、经济、社会、人物，为研究者保存资料", diag: "「全面客观记录」听起来中性，但没有任何记录形式是中性的。一本志书的纲目已经决定了什么值得写、什么算「全面」。选择体例就是选择立场。" },
          { key: "D", text: "增强村民的文化认同感和归属感", diag: "「增强认同感和归属感」听起来温情，但要追问：谁的认同？哪一种「我们」？当代村志谁来主持？他们写出来的「我们村」自然会反映他们的位置，往往结构性地不在「我们」之内。" },
          { key: "E", text: "总结基层治理经验，为乡村振兴提供参考", diag: "古代县志之所以叫「资治」，是因为新任流官需要快速了解地方情况。而当代乡村振兴所需要的信息已经由统计局等部门连续生产，志书里那种「叙述式」的总结对当代政策制定基本无用。" },
          { key: "F", text: "这是一项严肃的历史学／人类学研究工作", diag: "方向对了，但下面几道题会检验「严肃研究」在你脑子里到底是什么样子。" }
        ]
      },
      {
        num: "二",
        title: "古代县志和你想编的村志，最关键的区别是什么？",
        options: [
          { key: "A", text: "没有本质区别，村志是县志的微缩版", diag: "这意味着完全没有思考过方志体例的制度位置——把「志」当成万能容器，仿佛只要按纲目装内容就行。" },
          { key: "B", text: "村志更亲切、更有人情味、更接地气", diag: "这是审美化、情感化的判断，没有方法论自觉。「亲切」「人情味」恰恰是村志最危险的标签——它让写作者放下警惕。" },
          { key: "C", text: "古代县志是官修服务于流官治理，当代村志没有这个对应功能", diag: "意识到方志不是中性的「记录」，而是前现代国家治理地方的一种具体技术。" },
          { key: "D", text: "古代根本没有稳固的村志传统，把它说成「传统」本身就是被建构的", diag: "承认这一点，意味着接受一个不舒服的事实：当代「村志运动」需要凭其当下的目的和方法来辩护。" },
          { key: "E", text: "古代县志的编修主体是士绅，村志在传统中编修主体是宗族，两者预设的「地方」完全不同", diag: "意识到志书不是被「写出来」的，是被某一类人、从某一个位置按预设写出来的。" },
          { key: "F", text: "应该完全按古代体例（疆域、沿革、山川、人物、风俗、艺文等）来编", diag: "这是直接的复古立场，逻辑上是诚实的，可以正面回答为什么 21 世纪还要采用这套预设。" },
          { key: "G", text: "应该在古代体例基础上创造方志新体例，既继承精华又适应当代", diag: "表面看最理性，实际上往往是一种用现代语言包装的复古，纲目本身的逻辑没动。" }
        ]
      },
      {
        num: "三",
        title: "当代村志中流行“志谱合一”（把家谱内容并入村志）的做法，你怎么看？",
        options: [
          { key: "A", text: "很好，这是创新，让村志更完整", diag: "把「创新」当成自动褒义词。把宗族世系制度化为村庄的官方记录。" },
          { key: "B", text: "不错，毕竟宗族是村庄的根基", diag: "「宗族是村庄的根基」这个说法本身就是被建构的，是明清时期国家政策与士绅推动的产物。" },
          { key: "C", text: "可以接受，但要注意把女性、外姓人也写进去就好", diag: "停留在「补丁」思路。父系世系的叙述结构不改变，结构依然没动。" },
          { key: "D", text: "有问题——这等于把父系宗族叙事制度化为村庄的本体定义", diag: "意识到「由谁来定义村庄」本身是政治行为。" },
          { key: "E", text: "严重问题——它在 21 世纪重新激活了一套已被严肃学术批判过的知识范式", diag: "批判了一种「线性连续性叙事」，主动压抑断裂、冲突与分叉。" }
        ]
      },
      {
        num: "四",
        title: "现代行政系统（统计、规划、档案、土地登记等）和村志，关系是什么？",
        options: [
          { key: "A", text: "两者无关，村志记录文化和情感，行政系统记录数据", diag: "完全没有思考过「国家如何看见地方」这个核心问题。" },
          { key: "B", text: "村志可以补充行政系统的不足", diag: "「补丁」思路。行政系统的不足不是缺故事和人情，而是缺乏对结构性问题的把握。" },
          { key: "C", text: "在县级以上，行政系统已经替代了方志的「资治」功能；但在村一级，行政系统的覆盖反而薄弱", diag: "当代县级治理已被现代行政技术接管，但村一级的信息系统反而稀薄。" },
          { key: "D", text: "正因为村一级行政信息薄弱，旧式村志才有功能空间——但功能空间不等于正当性", diag: "关键的方法论突破。现成不等于合理。" },
          { key: "E", text: "应该用现代社会科学的方法（统计、田野、档案批判）来填补村级信息空白，而不是回到旧志体例", diag: "系统化的村级统计 + 人类学田野 + 档案建设 + 口述史项目。" }
        ]
      },
      {
        num: "五",
        title: "你觉得历史学和人类学研究村庄，与编修村志，是同一回事吗？",
        options: [
          { key: "A", text: "是的，都是记录村庄的过去和现在", diag: "完全没有学科自觉。把「记录」当作中性活动。" },
          { key: "B", text: "修志是基础，研究是在志书基础上的提炼", diag: "预设了先有「客观记录」，再有「解释分析」的两层模型。" },
          { key: "C", text: "不同——研究有问题意识、有理论框架、有批判性，修志是资料汇编", diag: "基本的学科分工意识，但仍停留在形式差异层面。" },
          { key: "D", text: "根本不同——修志预设「村」是连续的本体，研究把「村」作为问题来解构", diag: "对「连续性叙事」的批判。" },
          { key: "E", text: "严肃的乡村研究（如华南学派）已经把方志和族谱当作史料来批判性使用，而不是当作模板来效仿", diag: "「史料」和「模板」的区分是关键。" }
        ]
      },
      {
        num: "六",
        title: "面对村庄消亡，最该做的是什么？",
        options: [
          { key: "A", text: "抓紧编修村志，趁老人还在，留下记忆", diag: "仓促的写作会自动滑向最熟悉、最现成的形式，把真实的复杂性彻底过滤掉。" },
          { key: "B", text: "拍纪录片、办村史馆、做口述史项目", diag: "方法上更现代，但仍然是参与式的，没有研究距离。" },
          { key: "C", text: "做严肃的村庄研究——研究村庄如何消亡、谁先离开、土地如何处置、记忆如何在迁居社区重组", diag: "废墟人类学层面。值得研究的不是「消亡之前的样子」，而是「正在如何消亡」。" },
          { key: "D", text: "研究「村志热」和「乡愁话语」本身——把这种抢救冲动作为研究对象", diag: "意识到「抢救」本身就是现象，属于知识社会学层面的问题。" },
          { key: "E", text: "C 和 D 同时做，并保持自觉：参与抢救的人不是研究者，研究「抢救现象」的人才是", diag: "完整的方法论位置，对自己的位置保持区分。" }
        ]
      },
      {
        num: "七",
        title: "当你想象「研究一个村庄」时，你脑中第一个想问的问题是什么？",
        options: [
          { key: "A", text: "这个村从古到今都发生了什么？", diag: "编年体／志书式的提问。产出的是 chronicle，不是 history。" },
          { key: "B", text: "这个村现在是什么样子？和 30 年前／50 年前／100 年前比有什么变化？", diag: "描述式／早期民俗志的提问。停留在对比记录层面。" },
          { key: "C", text: "为什么这个村会出现 X 现象？／这个村是怎么经历 Y（土改、集体化、打工潮等）的？", diag: "现代历史学的提问方式。要求因果分析与机制说明。" },
          { key: "D", text: "这个村的某个具体现象，能告诉我们关于（国家、市场、性别、宗教等）什么更普遍的问题？", diag: "社会科学／人类学的提问方式。把村庄看作一个透镜。" },
          { key: "E", text: "「这个村」的边界、定义、故事是怎么被建构出来的？谁有权力定义它？", diag: "批判性／反思性研究的提问方式，问的是「知识—权力」层面的问题。" }
        ]
      },
      {
        num: "八",
        title: "村里的祠堂是一个重要对象。下面哪种处理方式才算「研究」？",
        options: [
          { key: "A", text: "拍照、记录建筑形制、抄录碑文、列出供奉先人——保护文化遗产", diag: "文物保护／文化遗产的工作模式，本质上是博物馆工作，不是研究。" },
          { key: "B", text: "梳理祠堂历史、列出历代重要祭祀活动、记录入祠族人——志谱式记述", diag: "志书式记述。把祠堂当作自足对象，没有问「为什么」。" },
          { key: "C", text: "考证祠堂何时建、由谁出资、在什么政治背景下建立、反映了当时国家与地方的什么关系", diag: "历史学的处理方式。揭示出祠堂是国家—地方互动的具体产物。" },
          { key: "D", text: "观察当下祠堂里的祭祀活动、访谈参与者、分析谁参与谁被排除、它在当代村庄生活中起什么社会作用", diag: "人类学的处理方式，揭示当代权力关系。" },
          { key: "E", text: "以上都有用，但产出的是不同性质的知识——只有 C 和 D 才是现代学科意义上的「研究」", diag: "学科自觉：理解不同的处理方式产出不同的知识。" }
        ]
      },
      {
        num: "九",
        title: "研究发现某村的宗族实际上是 16 世纪才「建构」起来的，但村民坚持说自己的祖先从唐代就在这里。研究者应该怎么处理？",
        options: [
          { key: "A", text: "尊重村民的说法——他们最了解自己的历史", diag: "民俗采集的立场。把被建构的叙述当成本真权威等于为地方权力做背书。" },
          { key: "B", text: "两个版本都记录下来，但以村民说法为主，以示尊重传统", diag: "折中立场在方法论上站不住脚。" },
          { key: "C", text: "把历史考证结果写出来作为事实，但表述上要委婉，避免冒犯村民", diag: "老派实证史学的立场，但没有把「为什么会有这种神话」本身当作问题。" },
          { key: "D", text: "把「差异本身」作为研究对象——为什么这个村需要一个唐代起源神话？这个神话在维护什么？", diag: "现代历史学和人类学的核心位置。村民的「错误」叙述本身就是最珍贵的研究材料。" }
        ]
      },
      {
        num: "十",
        title: "当你想为村庄编修一本志书时，你是以什么身份在做这件事？",
        options: [
          { key: "A", text: "我是这个村出身的人，这是我对家乡的责任", diag: "「内部人研究」。盲区是最难看清习以为常的事情有什么问题。" },
          { key: "B", text: "我是村里的退休干部／文化名人／有号召力的人，村里需要我来牵头", diag: "位置内嵌于将要书写的对象之中，下笔时会有具体的避讳方向。" },
          { key: "C", text: "我是受村委会或地方政府委托的执笔人", diag: "写作必然要通过审稿审批链条，写什么由链条决定。" },
          { key: "D", text: "我是研究者，村庄是我的研究对象", diag: "纯研究者位置没有内嵌于地方利益结构，可以问当地人不能或不愿问的问题。" },
          { key: "E", text: "我是参与者也是研究者——既写也反思自己在写", diag: "「自我民族志」。承认双重身份，并把这种双重性变成研究的工具。" },
          { key: "F", text: "我没想过这个问题，我以为修志就是修志，和谁来修没关系", diag: "实证主义的中性观。作者位置不会因为你不思考它就消失（学究式偏见）。" }
        ]
      },
      {
        num: "十一",
        title: "你修志的对象，最重要的「读者」是谁？",
        options: [
          { key: "A", text: "当下的村民——让他们了解自己村的历史", diag: "自动激活突出自豪内容、淡化长期矛盾的倾向，是一种公关文体。" },
          { key: "B", text: "离开村庄的游子——为他们保留乡愁的载体", diag: "生产记忆之场，其功能是情感安抚而不是历史认知。" },
          { key: "C", text: "后人和子孙——让几百年后的人知道我们曾经存在过", diag: "当代写作者认为「不重要」而省略掉的东西恰恰是几百年后研究者最想要的。" },
          { key: "D", text: "学术界——为研究者提供资料", diag: "研究者真正需要的是未经过滤的原始档案与田野记录。" },
          { key: "E", text: "地方政府／上级方志办——完成体制内的文化工程任务", diag: "体制任务有其格式要求和审查逻辑，会直接决定文本的样子。" },
          { key: "F", text: "没想过——只想「把它写出来」", diag: "无意识地默认采纳了村民加方志办的混合隐含读者。" }
        ]
      },
      {
        num: "十二",
        title: "以下哪种工作最接近你想做的事？",
        options: [
          { key: "A", text: "写一本传统体例的村志——纲目分明，内容齐全", diag: "明确的修志工作。" },
          { key: "B", text: "编一本「村庄记忆集」——访谈老人，整理口述故事，配老照片", diag: "口述史和记忆汇编是一种独立的知识形态，不需要套上志书纲目。" },
          { key: "C", text: "建一个村史档案室——收集契约、账本、奖状、票证、信件等原始材料并系统编号", diag: "当代基层最稀缺、最有价值的工作。档案远比修志重要。" },
          { key: "D", text: "拍一部纪录片——记录消失中的村庄当下的状态", diag: "视觉民族志。能记录空间、动作、声响，是文字志书做不到的。" },
          { key: "E", text: "写一本严肃的村庄历史／社会研究专著——有问题意识、有论证、有理论对话", diag: "研究专著，需要学院训练。" },
          { key: "F", text: "写一本关于「为什么 21 世纪还在抢救修志」的研究——把当代修志运动本身作为对象", diag: "元层级的位置，将修志运动本身作为研究对象。" }
        ]
      },
      {
        num: "十二点五",
        title: "如果你不是研究者，但你想为家乡留下文字，你最希望避免的是什么？",
        options: [
          { key: "A", text: "啥都不希望避免，把好的留下来就行", diag: "「好的」由谁定义？会自动过滤掉村庄真实历史的一半甚至更多。" },
          { key: "B", text: "避免内容不全、不够「有面子」", diag: "写作的标准不是真实，而是形象。" },
          { key: "C", text: "避免冒犯村里的某些家族或某些人", diag: "每一处「避免冒犯」，都是一处真实历史的省略。" },
          { key: "D", text: "避免把村里的真实矛盾、冲突、暴力写出来——这些不光彩", diag: "用当下共同体的脸面，覆盖了那些已经无法发声的人的苦难。" },
          { key: "E", text: "避免把村庄写成一个不存在的、被美化过的版本，因为美化的家乡其实是另一个家乡", diag: "参与者立场里最成熟的位置：对「留下真实」有基本敬意。" }
        ]
      },
      {
        num: "十三",
        title: "当你看到「中国每年消失数万个村庄」这类数据，你的第一反应是什么？",
        options: [
          { key: "A", text: "痛心，必须立刻抢救——再不做就来不及了", diag: "情感反应直接跳到行动反应，抢救出来的往往是想象，而不是真实的村庄变迁。" },
          { key: "B", text: "这是必然趋势，应该顺其自然", diag: "技术决定论。把活生生的政治经济决策过程包装成自然规律。" },
          { key: "C", text: "这是城市化代价，需要在效率和人文之间平衡", diag: "温和的中间立场，「平衡」往往是回避具体分析的修辞。" },
          { key: "D", text: "这个数据本身值得追问——「消失」具体指什么？物理拆除？人口迁出？行政合并？", diag: "开始进入分析。这三种消失的性质完全不同。" },
          { key: "E", text: "「村庄消失」这种叙述本身就是一个值得研究的话语——它什么时候被谁在讲？", diag: "元层级反应。当一个社会开始大规模谈论「失去」时，这种谈论本身值得研究。" }
        ]
      },
      {
        num: "十四",
        title: "村庄消亡情境下，下面哪种工作最有价值？",
        options: [
          { key: "A", text: "趁老人还在，赶紧把村史写出来", diag: "产出静态记录，错过了动态过程。" },
          { key: "B", text: "趁老房子还在，赶紧拍照建档", diag: "停留在保存遗存层面，告诉不了你它经历了什么。" },
          { key: "C", text: "跟踪研究这个村是怎么消亡的——谁先走、土地怎么处置、家具怎么搬、祠堂怎么处理", diag: "过程性追踪。撤村并居的案例本身就是一个完整的当代中国政治经济样本。" },
          { key: "D", text: "研究消亡过程中的具体冲突——征地补偿是怎么谈的、谁被强制、抵抗的代价是什么", diag: "更尖锐的版本，直接切入消亡过程中的冲突和权力。" },
          { key: "E", text: "研究迁居后的村民——他们的新生活什么样、他们和原来的村庄是什么关系", diag: "被严重忽视的维度。人类学的本体是人。" },
          { key: "F", text: "研究「乡愁话语」和村志运动本身——为什么是这个时刻、谁在生产这种话语", diag: "知识社会学层面的元研究。" }
        ]
      },
      {
        num: "十五",
        title: "城市化、现代化、村庄消亡——你怎么看这三者的关系？",
        options: [
          { key: "A", text: "城市化和现代化是好事，但代价是村庄消亡，这是必要的牺牲", diag: "把活生生的政治经济过程包装成「必要牺牲」，免除了具体决策者的责任。" },
          { key: "B", text: "城市化和现代化是被强加的，村庄本来可以以自己的方式延续", diag: "浪漫保守主义。假设有一个静止孤立的「村庄本来的样子」存在。" },
          { key: "C", text: "三者的关系不是因果链——「村庄消亡」是当代中国特定土地、户籍、地方财政体制共同作用的结果", diag: "中国村庄消亡是由具体的制度安排造成的，每一项都是可以选择的政治决定。" },
          { key: "D", text: "「村庄」和「城市」这种对立本身需要被质疑——城中村、半工半耕、流动村庄早已超出了二分", diag: "更高级的分析。大量中国人早已生活在这个二分之外。" },
          { key: "E", text: "「村庄消亡」作为话题的兴起，本身就是城市化进入特定阶段的产物——大部分人离开后才会集体怀念", diag: "元层级的洞察。乡愁作为一种集体情感的兴起是 7 亿人离开土地之后的产物。" }
        ]
      }
    ];

    // 应用状态
    let state = {
      page: 0, // 0: 封面, 1~16: 题目页, 17: 结语
      expanded: {} // 记录每道题展开了哪些选项 { qIndex: { optKey: true } }
    };

    // 渲染主函数
    function render() {
      const app = document.getElementById('app');

      // 1. 封面页
      if (state.page === 0) {
        app.innerHTML = `
          <div class="page-in container" style="justify-content: space-between;">
            <div style="display: flex; justify-content: space-between;">
              <span class="sans-small">A SELF-DIAGNOSIS</span>
              <span class="sans-small">16 QUESTIONS</span>
            </div>
            
            <div style="max-width: 48rem; margin: 0 auto; width: 100%; text-align: left; padding: 2rem 0;">
              <h1 class="serif-title" style="font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.25; margin-bottom: 1.5rem;">
                关于<span class="seal-color">「为村庄修志」</span>的<br>十六个问题
              </h1>
              <div class="serif-italic ink-soft" style="font-size: 1.25rem; margin-bottom: 2rem;">
                ${COVER.title}
              </div>
              <div class="line-divider"></div>
              <div class="serif-body ink-soft" style="font-size: 1rem; line-height: 1.8;">
                ${COVER.intro.map(p => `<p style="margin-bottom: 1.25rem;">${p}</p>`).join('')}
              </div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-top: 2rem;">
              <button onclick="goToPage(1)" class="start-button">${COVER.start}</button>
              <span class="sans-small">TSURUYAMA &middot; MMXXVI</span>
            </div>
          </div>
        `;
      } 
      // 2. 题目页 (1 ~ 16)
      else if (state.page >= 1 && state.page <= Q.length) {
        const idx = state.page - 1;
        const q = Q[idx];
        const progress = (state.page / Q.length) * 100;
        const expandedSet = state.expanded[idx] || {};
        const expandedCount = Object.keys(expandedSet).length;

        app.innerHTML = `
          <div class="page-in container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <span class="sans-small">QUESTION ${state.page} / ${Q.length}</span>
              <span class="serif-italic ink-faint" style="font-size: 0.875rem;">${q.num}</span>
            </div>
            
            <div class="progress-track">
              <div class="progress-fill" style="width: ${progress}%;"></div>
            </div>
            
            <div style="max-width: 48rem; margin: 0 auto; width: 100%; flex: 1;">
              <div style="display: flex; align-items: baseline; gap: 1.25rem; margin-bottom: 2.5rem;">
                <span class="serif-title seal-color" style="font-size: 3.5rem; line-height: 1;">${q.num}</span>
                <div class="vertical-line" style="align-self: stretch; width: 1px;"></div>
                <h2 class="serif-title" style="font-size: 1.25rem; line-height: 1.4; flex: 1; margin: 0;">${q.title}</h2>
              </div>

              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${q.options.map(opt => {
                  const isExpanded = !!expandedSet[opt.key];
                  return `
                    <div onclick="toggleOption(${idx}, '${opt.key}')" class="option-card ${isExpanded ? 'expanded' : ''}">
                      <div style="display: flex; gap: 1rem; align-items: flex-start;">
                        <span class="option-letter ${isExpanded ? 'expanded' : 'collapsed'}">${opt.key}.</span>
                        <span class="serif-body" style="font-size: 1rem; line-height: 1.6; flex: 1;">${opt.text}</span>
                      </div>
                      ${isExpanded ? `
                        <div class="option-diag">
                          <div class="vertical-line"></div>
                          <p class="serif-body ink-soft" style="font-size: 0.95rem; line-height: 1.8; flex: 1; margin: 0;">${opt.diag}</p>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="nav-buttons" style="max-width: 48rem; margin: 0 auto; width: 100%;">
              <button onclick="changePage(-1)" ${idx === 0 ? 'disabled' : ''} class="nav-btn">&larr; 上一题</button>
              <span class="serif-italic ink-faint" style="font-size: 0.75rem;">${expandedCount > 0 ? `已读 ${expandedCount} 个诊断` : "点击选项展开诊断"}</span>
              <button onclick="changePage(1)" class="nav-btn">${idx === Q.length - 1 ? "结" : "下一题"} &rarr;</button>
            </div>
          </div>
        `;
      } 
      // 3. 结语页
      else {
        app.innerHTML = `
          <div class="page-in container" style="justify-content: space-between;">
            <div style="display: flex; justify-content: space-between;">
              <span class="sans-small">END</span>
              <span class="sans-small">${Q.length} / ${Q.length}</span>
            </div>
            
            <div style="max-width: 48rem; margin: 0 auto; width: 100%; text-align: left; padding: 2rem 0;">
              <div style="margin-bottom: 2rem;"><span class="seal-stamp">尾</span></div>
              <div class="line-divider"></div>
              <div class="serif-title" style="font-size: 1.5rem; line-height: 2;">
                <p style="margin-bottom: 1.5rem;">这套问卷的目的不是<span class="seal-color">驳倒</span>任何想为家乡留下文字的人。</p>
                <p>让人知道自己<span class="seal-color">在做什么</span>，是这套问卷唯一的目标。</p>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-top: 2rem;">
              <button onclick="goToPage(0)" class="start-button">${CLOSING.restart}</button>
              <span class="sans-small">TSURUYAMA &middot; MMXXVI</span>
            </div>
          </div>
        `;
      }

      // 页面滚动回顶部
      window.scrollTo(0, 0);
    }

    // 交互动作逻辑
    function goToPage(pageNum) {
      state.page = pageNum;
      render();
    }

    function changePage(direction) {
      const target = state.page + direction;
      if (target >= 0 && target <= Q.length + 1) {
        state.page = target;
        render();
      }
    }

    function toggleOption(qIdx, optKey) {
      if (!state.expanded[qIdx]) {
        state.expanded[qIdx] = {};
      }
      state.expanded[qIdx][optKey] = !state.expanded[qIdx][optKey];
      render();
    }

    // 初始首屏渲染
    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
