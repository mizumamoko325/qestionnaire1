const chineseNum = (n) => {
  const map = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  if (n <= 10) return map[n];
  if (n < 20) return "十" + map[n - 10];
  return n.toString();
};

      {
        key: "D",
        text: "「村庄」和「城市」这种对立本身需要被质疑——很多「城中村」、「半工半耕」、「流动村庄」早已超出了这种二分",
        diag: "更高级的分析。它质疑「村—城」二分本身——大量当代中国人早已生活在这个二分之外：城中村居民、流动家庭（人在城里、户口在村、孩子在县）、半工半耕家庭、跨省打工的「两栖人口」。在这种现实下，「村庄消亡」叙事其实是用一个已经失效的二分法在描述一个早已超出它的现实。",
      },
      {
        key: "E",
        text: "「村庄消亡」作为话题的兴起，本身就是城市化进入特定阶段的产物——一个社会只有在大部分人已经离开村庄之后，才会开始集体怀念村庄",
        diag: "元层级的洞察。这一条是这套问卷里最重要的判断之一：怀念村庄是城市化的产物，不是它的对立面。在 1980 年代之前的中国，没有人会大规模地「怀念村庄」——因为绝大多数人就在村里。「乡愁」作为一种集体情感的兴起，本身是城市化让 7 亿人离开土地之后的产物。Raymond Williams 在《乡村与城市》（The Country and the City）里有一个经典论断：每一代英国人都在怀念「上一代的乡村」，而上一代其实正在怀念更上一代的乡村——「消失中的真实乡村」是一个永远后退的影子。中国今天的「村庄消亡」话语，套用这个洞察后会变得非常清楚：我们怀念的不是任何一个具体的村庄，是一个永远被想象成「刚刚还在但即将消失」的村庄。这个想象的功能，比它对应的真实更重要。",
      },
    ],
  },
];

const chineseNum = (n) => {
  const map = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  if (n <= 10) return map[n];
  if (n < 20) return "十" + map[n - 10];
  return n.toString();
};

function App() {
  const [page, setPage] = useState(0);
  const [expanded, setExpanded] = useState({});

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [page]);

  const total = Q.length;

  const handleStart = () => setPage(1);
  const handleRestart = () => {
    setPage(0);
    setExpanded({});
  };

  const handleToggle = (qIdx, optKey) => {
    setExpanded((prev) => {
      const current = prev[qIdx] ? new Set(prev[qIdx]) : new Set();
      if (current.has(optKey)) current.delete(optKey);
      else current.add(optKey);
      return { ...prev, [qIdx]: current };
    });
  };

  const handlePrev = () => {
    if (page > 1) setPage(page - 1);
  };
  const handleNext = () => {
    if (page <= total) setPage(page + 1);
  };

  const renderContent = () => {
    if (page === 0) return <Cover onStart={handleStart} />;
    if (page > total) return <Closing onRestart={handleRestart} />;
    const qIdx = page - 1;
    const q = Q[qIdx];
    const expandedSet = expanded[qIdx] || new Set();
    return (
      <QuestionPage
        key={page}
        q={q}
        idx={qIdx}
        total={total}
        expanded={expandedSet}
        onToggle={(optKey) => handleToggle(qIdx, optKey)}
        onPrev={handlePrev}
        onNext={handleNext}
      />
    );
  };

  return (
    <div className="paper-bg min-h-screen w-full">
      <style>{styles}</style>
      {renderContent()}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
