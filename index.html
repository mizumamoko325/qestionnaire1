const chineseNum = (n) => {
  const map = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  if (n <= 10) return map[n];
  if (n < 20) return "十" + map[n - 10];
  return n.toString();
};

  }
  .start-button:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .seal-stamp {
    display: inline-block;
    border: 1.5px solid var(--seal);
    color: var(--seal);
    padding: 6px 10px;
    font-family: serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.15em;
    transform: rotate(-2deg);
  }

  .vertical-line {
    width: 1px;
    background: var(--ink-faint);
  }

  .progress-track {
    height: 1px;
    background: var(--line-faint);
    width: 100%;
  }
  .progress-fill {
    height: 1px;
    background: var(--seal);
    transition: width 600ms ease-out;
  }
`;

function Cover({ onStart }) {
  return (
    <div className="page-in min-h-screen flex flex-col justify-between px-8 py-12 md:px-16 md:py-20">
      <div className="flex justify-between items-start">
        <div className="qfont-small ink-faint text-xs fade-up-1">A SELF-DIAGNOSIS</div>
        <div className="qfont-small ink-faint text-xs fade-up-1">16 QUESTIONS</div>
      </div>

      <div className="flex-1 flex flex-col justify-center max-w-3xl mx-auto w-full">
        <h1 className="qfont-display ink text-4xl md:text-6xl leading-tight fade-up-2 mb-6">
          关于<span className="seal-color">「为村庄修志」</span>的
          <br />
          十六个问题
        </h1>

        <div className="qfont-italic ink-soft text-xl md:text-2xl fade-up-3 mb-12">
          一份自我诊断
        </div>

        <div className="line-divider h-px w-24 fade-up-3 mb-8"></div>

        <div className="qfont-body ink-soft text-base md:text-lg leading-relaxed space-y-5 max-w-2xl">
          {COVER.intro.map((p, i) => (
            <p key={i} className={`fade-up-${Math.min(i + 3, 5)}`}>{p}</p>
          ))}
        </div>
      </div>

      <div className="flex flex-col items-center gap-6 mt-12 fade-up-5">
        <button onClick={onStart} className="start-button">{COVER.start}</button>
        <div className="qfont-small ink-faint text-xs">TSURUYAMA &middot; MMXXVI</div>
      </div>
    </div>
  );
}

function QuestionPage({ q, idx, total, expanded, onToggle, onPrev, onNext }) {
  const progress = ((idx + 1) / total) * 100;

  return (
    <div className="page-in min-h-screen flex flex-col px-6 py-8 md:px-16 md:py-12">
      <div className="flex justify-between items-center mb-2">
        <div className="qfont-small ink-faint text-xs">QUESTION {idx + 1} / {total}</div>
        <div className="qfont-italic ink-faint text-sm">{q.num}</div>
      </div>

      <div className="progress-track mb-12">
        <div className="progress-fill" style={{ width: `${progress}%` }}></div>
      </div>

      <div className="max-w-3xl mx-auto w-full flex-1">
        <div className="flex items-baseline gap-4 mb-10">
          <span className="qfont-display seal-color text-5xl md:text-6xl leading-none">{q.num}</span>
          <div className="vertical-line self-stretch"></div>
          <h2 className="qfont-display ink text-xl md:text-2xl leading-snug flex-1">{q.title}</h2>
        </div>

        <div className="space-y-3">
          {q.options.map((opt) => {
            const isExpanded = expanded.has(opt.key);
            return (
              <div
                key={opt.key}
                onClick={() => onToggle(opt.key)}
                className={`option-card border border-line rounded-sm p-5 md:p-6 ${isExpanded ? "expanded" : ""}`}
              >
                <div className="flex gap-4 items-start">
                  <span className={`option-letter text-xl md:text-2xl flex-shrink-0 mt-0.5 ${isExpanded ? "seal-color" : "ink-faint"}`} style={{ minWidth: "1.5rem" }}>
                    {opt.key}.
                  </span>
                  <span className="qfont-body ink text-base leading-relaxed flex-1" style={{ fontSize: "16.5px" }}>
                    {opt.text}
                  </span>
                </div>
                {isExpanded && (
                  <div className="option-expand mt-5 pt-5 border-t border-line-faint">
                    <div className="flex gap-4">
                      <div className="vertical-line flex-shrink-0" style={{ background: "var(--seal)", opacity: 0.4 }}></div>
                      <p className="qfont-body ink-soft text-base leading-loose flex-1" style={{ fontSize: "15.5px" }}>
                        {opt.diag}
                      </p>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="max-w-3xl mx-auto w-full mt-16 pt-8 border-t border-line-faint flex justify-between items-center">
        <button onClick={onPrev} disabled={idx === 0} className="nav-button text-sm md:text-base">← 上一题</button>
        <div className="qfont-italic ink-faint text-xs">
          {expanded.size > 0 ? `已读 ${expanded.size} 个诊断` : "点击选项展开诊断"}
        </div>
        <button onClick={onNext} className="nav-button text-sm md:text-base">
          {idx === total - 1 ? "结" : "下一题"} →
        </button>
      </div>
    </div>
  );
}

function Closing({ onRestart }) {
  return (
    <div className="page-in min-h-screen flex flex-col justify-between px-8 py-12 md:px-16 md:py-20">
      <div className="flex justify-between items-start">
        <div className="qfont-small ink-faint text-xs fade-up-1">END</div>
        <div className="qfont-small ink-faint text-xs fade-up-1">16 / 16</div>
      </div>

      <div className="flex-1 flex flex-col justify-center max-w-3xl mx-auto w-full">
        <div className="fade-up-2 mb-10">
          <span className="seal-stamp">尾</span>
        </div>
        <div className="line-divider h-px w-24 fade-up-2 mb-12"></div>
        <div className="qfont-display ink text-2xl md:text-3xl leading-loose space-y-10 max-w-2xl">
          <p className="fade-up-3">这套问卷的目的不是<span className="seal-color">驳倒</span>任何想为家乡留下文字的人。</p>
          <p className="fade-up-4">让人知道自己<span className="seal-color">在做什么</span>，是这套问卷唯一的目标。</p>
        </div>
      </div>

      <div className="flex flex-col items-center gap-6 mt-12 fade-up-5">
        <button onClick={onRestart} className="start-button">{CLOSING.restart}</button>
        <div className="qfont-small ink-faint text-xs">TSURUYAMA &middot; MMXXVI</div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState(0);
  const [expanded, setExpanded] = useState({});

  useEffect(() => {
    window.scrollTo(0, 0);
  }, [page]);

  const total = Q.length;

  const handleStart = () => setPage(1);
  const handleRestart = () => {
    setPage(0);
    setExpanded({});
  };

  const handleToggle = (qIdx, optKey) => {
    setExpanded((prev) => {
      const current = prev[qIdx] ? new Set(prev[qIdx]) : new Set();
      if (current.has(optKey)) current.delete(optKey);
      else current.add(optKey);
      return { ...prev, [qIdx]: current };
    });
  };

  const handlePrev = () => { if (page > 1) setPage(page - 1); };
  const handleNext = () => { if (page <= total) setPage(page + 1); };

  const renderContent = () => {
    if (page === 0) return <Cover onStart={handleStart} />;
    if (page > total) return <Closing onRestart={handleRestart} />;
    const qIdx = page - 1;
    const q = Q[qIdx];
    const expandedSet = expanded[qIdx] || new Set();
    return (
      <QuestionPage
        key={page}
        q={q}
        idx={qIdx}
        total={total}
        expanded={expandedSet}
        onToggle={(optKey) => handleToggle(qIdx, optKey)}
        onPrev={handlePrev}
        onNext={handleNext}
      />
    );
  };

  return (
    <div className="paper-bg min-h-screen w-full">
      <style>{styles}</style>
      {renderContent()}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('hidden');
        setTimeout(() => loading.remove(), 500);
      }
    }, 100);
  </script>
</body>
</html>
